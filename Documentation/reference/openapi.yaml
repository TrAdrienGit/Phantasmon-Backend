openapi: 3.0.3
info:
  title: Phantasmon Backend API
  description: >
    API REST du backend Phantasmon, source de vérité des Ghost Pokémon, des échanges et des
    sessions de combat. Consommée exclusivement par le mod client Fabric (aucun serveur
    Minecraft n'appelle cette API).


    Ce contrat décrit l'implémentation réelle (vérifiée le 2026-10-06). Le protocole
    WebSocket (`/ws`) n'est pas décrit ici : voir `websocket-protocol.md`. Exemples et
    comportements détaillés : `rest-api.md`. Catalogue des erreurs : `error-codes.md`.


    Conventions : JSON en snake_case ; erreurs métier structurées (`ErrorResponse`) ;
    les erreurs de format (400) aussi : ERROR_VALIDATION_FAILED, ERROR_MALFORMED_REQUEST.


    Administration (TODO-25) : un admin est un joueur dont le pseudo de dernière connexion figure
    dans le fichier `admins.txt` du backend. Les routes `/admin/*` (hors `/admin/me`) lui sont
    réservées (403 ERROR_ADMIN_REQUIRED) ; il peut aussi lire et modifier le PC de n'importe quel
    joueur avec les routes Pokémon habituelles.
  version: 0.1.0
  license:
    name: GPL-3.0
    url: https://www.gnu.org/licenses/gpl-3.0.html
servers:
  - url: http://localhost:8080
    description: Développement local
tags:
  - name: Système
  - name: Authentification
  - name: Pokémon
  - name: Échanges
  - name: Combats
  - name: Administration
  - name: Hub

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Système]
      summary: Disponibilité du backend et de la base (SELECT 1)
      security: []
      responses:
        "200":
          description: Backend et base disponibles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example: { status: UP, database: UP }
        "503":
          description: Base injoignable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example: { status: DOWN, database: DOWN }

  /version:
    get:
      tags: [Système]
      summary: Version courante et version minimale supportée du client
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  current_version: { type: string, example: "0.1.0" }
                  min_supported_version: { type: string, example: "0.1.0" }

  /auth/challenge:
    post:
      tags: [Authentification]
      summary: Émet un défi de connexion à usage unique (SEC-1)
      description: >
        Le client utilise ce défi comme `server_id` de `joinServer` chez Mojang, puis l'envoie à `/auth/session`.
        Valable 60 s, usage unique : un `server_id` non émis ici est refusé, si bien qu'un serveur Minecraft tiers
        ne peut pas rejouer la preuve de connexion d'un joueur.
      security: []
      responses:
        "200":
          description: Défi émis
          content:
            application/json:
              schema:
                type: object
                required: [challenge]
                properties:
                  challenge: { type: string, example: 3f9c2a7e5b1d4c8a9e0f6b2d7a4c1e8f }
        "429":
          description: ERROR_AUTH_TOO_MANY_CHALLENGES
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/session:
    post:
      tags: [Authentification]
      summary: Échange une preuve de session Mojang contre un couple de JWT
      description: >
        Le client a appelé `joinServer` chez Mojang avec, comme `server_id`, un défi obtenu par
        `/auth/challenge` ; le backend consomme le défi, vérifie avec `hasJoined`, crée ou met à jour le
        joueur, puis émet les jetons.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uuid, username, server_id]
              properties:
                uuid: { type: string, format: uuid }
                username: { type: string, minLength: 1 }
                server_id: { type: string, minLength: 1 }
      responses:
        "200":
          description: Authentification réussie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          description: ERROR_VALIDATION_FAILED (champ manquant ou vide), ERROR_MALFORMED_REQUEST
        "401":
          description: ERROR_AUTH_INVALID_CHALLENGE, ERROR_AUTH_MOJANG_VERIFICATION_FAILED, ERROR_AUTH_UUID_MISMATCH
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/refresh:
    post:
      tags: [Authentification]
      summary: Renouvelle les deux jetons à partir du refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: Nouveaux jetons
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          description: ERROR_AUTH_INVALID_REFRESH_TOKEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pokemon:
    post:
      tags: [Pokémon]
      summary: Crée un Pokémon (idempotent via request_uuid)
      description: >
        Sans emplacement fourni, le Pokémon va dans la première case libre du PC. Un admin peut le créer
        dans le PC d'un autre joueur avec `owner` (import depuis le PC de ce joueur).
      parameters:
        - name: owner
          in: query
          required: false
          description: Propriétaire, s'il n'est pas l'appelant — admins uniquement (sinon 403 ERROR_ADMIN_REQUIRED)
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PokemonCreateRequest"
      responses:
        "201":
          description: Créé (ou réponse d'origine si request_uuid déjà vu)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pokemon"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /players/{uuid}/pokemon:
    get:
      tags: [Pokémon]
      summary: Tous les Pokémon du joueur authentifié (PC et équipe), ou de n'importe quel joueur pour un admin
      parameters:
        - $ref: "#/components/parameters/PlayerUuid"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pokemon"
        "403":
          $ref: "#/components/responses/Error"

  /players/{uuid}/pc:
    get:
      tags: [Pokémon]
      summary: Contenu d'une boîte du PC
      parameters:
        - $ref: "#/components/parameters/PlayerUuid"
        - name: box
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 16 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pokemon"
        "403":
          $ref: "#/components/responses/Error"

  /pokemon/{uuid}:
    patch:
      tags: [Pokémon]
      summary: Modifie ou déplace un Pokémon (mise à jour partielle)
      description: >
        `data`, s'il est fourni, remplace tout le JSONB. `team_slot` ou `box_id`+`box_slot`
        déplacent le Pokémon ; une destination occupée échange les deux Pokémon.
      parameters:
        - $ref: "#/components/parameters/PokemonUuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PokemonUpdateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pokemon"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Pokémon]
      summary: Supprime définitivement un Pokémon
      parameters:
        - $ref: "#/components/parameters/PokemonUuid"
      responses:
        "204":
          description: Supprimé
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: ERROR_POKEMON_IN_PENDING_TRADE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pokemon/{uuid}/clone:
    post:
      tags: [Pokémon]
      summary: Clone un Pokémon (nouvel UUID, première case libre du PC)
      parameters:
        - $ref: "#/components/parameters/PokemonUuid"
      responses:
        "201":
          description: Clone créé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pokemon"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /trades:
    post:
      tags: [Échanges]
      summary: Propose un échange asynchrone (idempotent via request_uuid)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_uuid, recipient_uuid, offered_pokemon_uuid, requested_pokemon_uuid]
              properties:
                request_uuid: { type: string, format: uuid }
                recipient_uuid: { type: string, format: uuid }
                offered_pokemon_uuid: { type: string, format: uuid }
                requested_pokemon_uuid: { type: string, format: uuid }
      responses:
        "201":
          description: Échange créé (PENDING)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /trades/{uuid}:
    get:
      tags: [Échanges]
      summary: Détail d'un échange (participants uniquement)
      parameters:
        - $ref: "#/components/parameters/TradeUuid"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /trades/{uuid}/accept:
    post:
      tags: [Échanges]
      summary: Accepte un échange (destinataire uniquement, transaction atomique)
      parameters:
        - $ref: "#/components/parameters/TradeUuid"
      responses:
        "200":
          description: Échange COMPLETED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /trades/{uuid}/cancel:
    post:
      tags: [Échanges]
      summary: Annule un échange PENDING (initiateur ou destinataire)
      parameters:
        - $ref: "#/components/parameters/TradeUuid"
      responses:
        "200":
          description: Échange CANCELLED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /players/{uuid}/trades:
    get:
      tags: [Échanges]
      summary: Échanges initiés ou reçus par le joueur authentifié
      parameters:
        - $ref: "#/components/parameters/PlayerUuid"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trade"
        "403":
          $ref: "#/components/responses/Error"

  /battles/{uuid}:
    get:
      tags: [Combats]
      summary: Détail d'une session (participants uniquement)
      parameters:
        - $ref: "#/components/parameters/BattleUuid"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleSession"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /admin/me:
    get:
      tags: [Administration]
      summary: L'appelant est-il admin ?
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [admin]
                properties:
                  admin: { type: boolean }

  /admin/players/{name}:
    get:
      tags: [Administration]
      summary: Joueur Phantasmon par pseudo (dernier pseudo connu, insensible à la casse)
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPlayer"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          description: ERROR_PLAYER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/battles/stop:
    post:
      tags: [Administration]
      summary: Arrête le combat (match nul, raison ADMIN_STOPPED) ou annule le lobby d'un joueur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [player]
              properties:
                player: { type: string, description: Pseudo d'un des deux joueurs }
      responses:
        "200":
          description: Arrêté
          content:
            application/json:
              schema:
                type: object
                required: [stopped, player]
                properties:
                  stopped: { type: string, enum: [BATTLE, LOBBY] }
                  player: { type: string }
        "403":
          $ref: "#/components/responses/Error"
        "404":
          description: ERROR_PLAYER_NOT_FOUND ou ERROR_ADMIN_NOTHING_TO_STOP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/reboot:
    post:
      tags: [Administration]
      summary: Redémarre le backend dans le même processus
      description: >
        Le contexte Spring est fermé puis relancé une demi-seconde après la réponse ; les combats
        en cours se terminent en match nul (BACKEND_LOST), les clients se reconnectent seuls.
      responses:
        "202":
          description: Redémarrage lancé
          content:
            application/json:
              schema:
                type: object
                required: [rebooting]
                properties:
                  rebooting: { type: boolean, example: true }
        "403":
          $ref: "#/components/responses/Error"

  /hub/anchors:
    get:
      tags: [Hub]
      summary: Hub Anchors d'un serveur et d'une dimension, partagés par ses joueurs (D-30)
      parameters:
        - name: server_fingerprint
          in: query
          required: true
          schema: { type: string, maxLength: 128 }
        - name: dimension
          in: query
          required: true
          schema: { type: string, maxLength: 128, example: "minecraft:overworld" }
      responses:
        "200":
          description: Anchors triés par nom
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HubAnchor"
        "400":
          $ref: "#/components/responses/Error"
    post:
      tags: [Hub]
      summary: Crée l'Anchor de l'appelant (un par joueur, idempotent via request_uuid)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_uuid, name, server_fingerprint, dimension, origin, yaw]
              properties:
                request_uuid: { type: string, format: uuid }
                name:
                  type: string
                  minLength: 3
                  maxLength: 32
                  description: Lettres, chiffres, espaces, - ou _, sans espace au début ni à la fin ; unique par serveur (casse ignorée)
                server_fingerprint: { type: string, maxLength: 128 }
                dimension: { type: string, maxLength: 128 }
                origin:
                  type: object
                  required: [x, y, z]
                  description: Position des pieds du créateur
                  properties:
                    x: { type: number, minimum: -30000000, maximum: 30000000 }
                    y: { type: number, minimum: -2048, maximum: 2048 }
                    z: { type: number, minimum: -30000000, maximum: 30000000 }
                yaw: { type: number, description: "Orientation Minecraft quelconque, arrondie au quart de tour" }
      responses:
        "201":
          description: Anchor créé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubAnchor"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          description: ERROR_HUB_ANCHOR_QUOTA ou ERROR_HUB_ANCHOR_NAME_TAKEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /hub/anchors/mine:
    get:
      tags: [Hub]
      summary: L'Anchor de l'appelant
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubAnchor"
        "404":
          $ref: "#/components/responses/Error"

  /hub/anchors/{uuid}:
    delete:
      tags: [Hub]
      summary: Supprime un Anchor (créateur ou admin)
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Supprimé
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /hub/schematic:
    get:
      tags: [Hub]
      summary: Construction du Global Hub (D-34) — description du schematic
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [name, format, sha256, size, bytes]
                properties:
                  name: { type: string, example: phantasmon_default_hub.schem }
                  format: { type: string, enum: [SCHEM, LITEMATIC] }
                  sha256: { type: string, description: SHA-256 du fichier en hexadécimal }
                  size:
                    type: object
                    properties:
                      x: { type: integer, example: 21 }
                      y: { type: integer, example: 21 }
                      z: { type: integer, example: 21 }
                  bytes: { type: integer, description: Taille du fichier en octets }

  /hub/schematic/file:
    get:
      tags: [Hub]
      summary: Construction du Global Hub (D-34) — le fichier (.schem ou .litematic, NBT gzip)
      responses:
        "200":
          description: Le fichier tel quel ; ETag = SHA-256
          content:
            application/octet-stream:
              schema: { type: string, format: binary }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PlayerUuid:
      name: uuid
      in: path
      required: true
      description: Doit être le joueur authentifié, sauf pour un admin (sinon 403 ERROR_OWNERSHIP_MISMATCH)
      schema: { type: string, format: uuid }
    PokemonUuid:
      name: uuid
      in: path
      required: true
      schema: { type: string, format: uuid }
    TradeUuid:
      name: uuid
      in: path
      required: true
      schema: { type: string, format: uuid }
    BattleUuid:
      name: uuid
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Error:
      description: Erreur métier structurée (voir error-codes.md)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      required: [error_code, details]
      properties:
        error_code:
          type: string
          example: ERROR_LEGALITY_EV_TOTAL_EXCEEDED
        details:
          type: object
          example: { total: 528, max: 510 }

    Health:
      type: object
      properties:
        status: { type: string, enum: [UP, DOWN] }
        database: { type: string, enum: [UP, DOWN] }

    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in:
          type: integer
          description: Durée de vie de l'access token en secondes
          example: 1200

    Stats:
      type: object
      properties:
        hp: { type: integer }
        atk: { type: integer }
        def: { type: integer }
        spa: { type: integer }
        spd: { type: integer }
        spe: { type: integer }

    PokemonData:
      type: object
      description: >
        JSONB libre. Seuls `ivs` (0-31) et `evs` (0-252, total ≤ 510) sont validés par le
        backend (avec la taille totale et le surnom). Les autres clés sont celles utilisées par le
        client, toutes en snake_case (migration V9).
      additionalProperties: true
      properties:
        nickname: { type: string }
        gender: { type: string, enum: [M, F], description: "Absente = aléatoire" }
        tera_type: { type: string }
        ivs: { $ref: "#/components/schemas/Stats" }
        evs: { $ref: "#/components/schemas/Stats" }
        moves:
          type: array
          maxItems: 4
          items: { type: string }
        held_item: { type: string }
        friendship: { type: integer }

    Pokemon:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        owner_uuid: { type: string, format: uuid }
        species: { type: string, example: samurott }
        form: { type: string, nullable: true, example: hisui }
        level: { type: integer, minimum: 1, maximum: 100 }
        nature: { type: string, example: timid }
        ability: { type: string, example: torrent }
        is_shiny: { type: boolean }
        box_id: { type: integer, nullable: true, minimum: 1, maximum: 16 }
        box_slot: { type: integer, nullable: true, minimum: 1, maximum: 30 }
        team_slot: { type: integer, nullable: true, minimum: 1, maximum: 6 }
        cobblemon_data_version: { type: string, example: "1.8.1" }
        data: { $ref: "#/components/schemas/PokemonData" }

    PokemonCreateRequest:
      type: object
      required: [request_uuid, species, level, nature, ability, cobblemon_data_version, data]
      properties:
        request_uuid: { type: string, format: uuid }
        species: { type: string, minLength: 1 }
        form: { type: string, nullable: true }
        level: { type: integer, minimum: 1, maximum: 100 }
        nature: { type: string, minLength: 1 }
        ability: { type: string, minLength: 1 }
        is_shiny: { type: boolean, default: false }
        box_id: { type: integer, minimum: 1, maximum: 16 }
        box_slot: { type: integer, minimum: 1, maximum: 30 }
        team_slot: { type: integer, minimum: 1, maximum: 6 }
        cobblemon_data_version: { type: string, minLength: 1 }
        data: { $ref: "#/components/schemas/PokemonData" }

    PokemonUpdateRequest:
      type: object
      description: Tous les champs sont optionnels ; box_id et box_slot vont ensemble.
      properties:
        data: { $ref: "#/components/schemas/PokemonData" }
        level: { type: integer, minimum: 1, maximum: 100 }
        nature: { type: string }
        ability: { type: string }
        is_shiny: { type: boolean }
        team_slot: { type: integer, minimum: 1, maximum: 6 }
        box_id: { type: integer, minimum: 1, maximum: 16 }
        box_slot: { type: integer, minimum: 1, maximum: 30 }
        cobblemon_data_version:
          type: string
          maxLength: 32
          description: Version de Cobblemon du client qui modifie ; conservée si absente.

    HubAnchor:
      type: object
      required: [uuid, owner_uuid, name, server_fingerprint, dimension, origin, yaw, size, created_at]
      properties:
        uuid: { type: string, format: uuid }
        owner_uuid: { type: string, format: uuid }
        name: { type: string, example: "Place du marché" }
        server_fingerprint: { type: string }
        dimension: { type: string, example: "minecraft:overworld" }
        origin:
          type: object
          required: [x, y, z]
          properties:
            x: { type: number }
            y: { type: number }
            z: { type: number }
        yaw: { type: integer, enum: [0, 90, 180, 270] }
        size: { type: integer, example: 21, description: "Arête du cube en blocs (phantasmon.hub.anchor-size)" }
        created_at: { type: string, format: date-time }
    Trade:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        initiator_uuid: { type: string, format: uuid }
        recipient_uuid: { type: string, format: uuid }
        offered_pokemon: { type: string, format: uuid }
        requested_pokemon: { type: string, format: uuid }
        status:
          type: string
          enum: [PENDING, ACCEPTED, CANCELLED, COMPLETED]

    AdminPlayer:
      type: object
      required: [uuid, name]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }

    BattleSession:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        player_a: { type: string, format: uuid }
        player_b: { type: string, format: uuid }
        team_a:
          type: array
          items: { type: string, format: uuid }
        team_b:
          type: array
          items: { type: string, format: uuid }
        status:
          type: string
          enum: [PENDING, ACTIVE, FINISHED, ABORTED]
        result:
          type: object
          nullable: true
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
