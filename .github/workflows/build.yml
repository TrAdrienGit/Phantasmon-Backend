name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # Testcontainers a besoin de Docker : disponible nativement sur les
    # runners GitHub-hosted ubuntu-latest, aucune config supplémentaire requise.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build -x test

      - name: Run tests (unitaires + intégration Testcontainers)
        env:
          # Test-only value, never the real deployment secret (which lives in
          # the untracked .env, see feedback_phantasmon_env_secrets memory).
          # Required because phantasmon.jwt.secret has no default in
          # application.properties — nothing overrides it for tests the way
          # Testcontainers' @ServiceConnection overrides the datasource, so
          # JwtService needs *some* value to build its bean at context startup.
          JWT_SECRET: ci-test-only-jwt-secret-never-used-in-production
        run: ./gradlew test

      - name: Publish test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: phantasmon-backend-jar
          path: build/libs/*.jar
