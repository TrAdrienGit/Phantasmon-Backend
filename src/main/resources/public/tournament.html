<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tournois Phantasmon</title>
<style>
  :root {
    --bg: #f6f4fb; --panel: #ffffff; --ink: #1d1a26; --muted: #6b6578; --line: #e3dff0;
    --accent: #7a3fd1; --win: #1f8a4c; --live: #1f6fd1; --wait: #b07a12; --lost: #9a96a5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14121a; --panel: #1d1a26; --ink: #ece9f5; --muted: #9a94ab; --line: #2e2a3b;
      --accent: #b48cff; --win: #4fd08a; --live: #6aa8ff; --wait: #e2b44b; --lost: #6f6a7d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 48px; }
  a { color: var(--accent); text-decoration: none; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 28px 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .meta { color: var(--muted); }
  .chip { display: inline-block; padding: 2px 9px; border-radius: 999px; background: var(--line); font-size: 13px; margin-right: 6px; }
  .chip.running { background: var(--accent); color: #fff; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .list { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 10px; overflow: hidden; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  th { color: var(--muted); font-weight: 600; font-size: 13px; }
  .players { display: flex; flex-wrap: wrap; gap: 6px; }
  .players span { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }
  .players .in { border-color: var(--win); }
  .players .out { text-decoration: line-through; color: var(--lost); }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .tabs button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  .tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .match { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--wait); border-radius: 8px; padding: 6px 10px; min-width: 190px; }
  .match.DONE { border-left-color: var(--win); }
  .match.PLAYING { border-left-color: var(--live); }
  .match .row { display: flex; justify-content: space-between; gap: 12px; }
  .match .row.won { font-weight: 700; }
  .match .row.lost, .match .row.empty { color: var(--lost); }
  .grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .bracket { display: flex; gap: 18px; overflow-x: auto; padding-bottom: 8px; }
  .col { display: flex; flex-direction: column; justify-content: space-around; gap: 10px; min-width: 200px; }
  .col h3 { font-size: 13px; color: var(--muted); margin: 0 0 2px; }
  .empty-state { color: var(--muted); padding: 24px 0; }
</style>
</head>
<body>
<main id="app"><p class="empty-state">Chargement…</p></main>
<script>
(() => {
  const app = document.getElementById('app');
  const name = decodeURIComponent(location.pathname.replace(/^\/t\/?/, '').replace(/\/$/, ''));
  const KIND = { SWISS: 'Weekly (ronde suisse)', BRACKET: 'Arbre (double élimination)' };
  const STATUS = { REGISTRATION: 'Inscriptions', CHECK_IN: 'Check-in', RUNNING: 'En cours', FINISHED: 'Terminé', CANCELLED: 'Annulé' };
  const BRACKET = { WINNERS: 'Winner', LOSERS: 'Loser', FINAL: 'Grande finale', RESET: 'Finale décisive' };
  let shownRound = null;
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const date = iso => iso ? new Date(iso).toLocaleString('fr-FR', { dateStyle: 'medium', timeStyle: 'short' }) : '—';

  function matchCard(m) {
    const row = (player, wins, other) => {
      const cls = player == null ? 'empty' : player === '-' ? 'empty' : m.winner == null ? '' : m.winner === player ? 'won' : 'lost';
      const label = player == null ? 'à venir' : player === '-' ? 'exempt' : esc(player);
      return `<div class="row ${cls}"><span>${label}</span><span>${player && player !== '-' && other !== '-' ? wins : ''}</span></div>`;
    };
    if (m.player2 == null && m.bracket === 'SWISS') {
      return `<div class="match DONE"><div class="row won"><span>${esc(m.player1)}</span><span>exempté</span></div></div>`;
    }
    return `<div class="match ${m.status}">${row(m.player1, m.wins1, m.player2)}${row(m.player2, m.wins2, m.player1)}${m.forfeit ? '<div class="meta">forfait</div>' : ''}</div>`;
  }

  function swiss(t) {
    if (!t.matches.length) return '';
    const rounds = [...new Set(t.matches.map(m => m.round))].sort((a, b) => a - b);
    const round = shownRound && rounds.includes(shownRound) ? shownRound : rounds[rounds.length - 1];
    const tabs = rounds.map(r => `<button data-round="${r}" class="${r === round ? 'on' : ''}">Ronde ${r}</button>`).join('');
    const standings = t.standings.map(s => `<tr><td>${s.rank}</td><td>${s.dropped ? '<s>' + esc(s.username) + '</s>' : esc(s.username)}</td>
      <td>${s.points}</td><td>${s.wins}-${s.losses}</td><td>${s.buchholz}</td><td>${Math.round(s.opponents_win_rate * 100)} %</td></tr>`).join('');
    return `<h2>Rondes (${t.current_round}/${t.planned_rounds ?? '?'})</h2><div class="tabs">${tabs}</div>
      <div class="grid">${t.matches.filter(m => m.round === round).map(matchCard).join('')}</div>
      <h2>Classement</h2><table><tr><th>#</th><th>Joueur</th><th>Points</th><th>V-D</th><th>Buchholz</th><th>Adv. %</th></tr>${standings}</table>`;
  }

  function bracket(t) {
    if (!t.matches.length) return '';
    const column = (title, list) => `<div class="col"><h3>${title}</h3>${list.map(matchCard).join('')}</div>`;
    const part = b => {
      const rounds = [...new Set(t.matches.filter(m => m.bracket === b).map(m => m.round))].sort((x, y) => x - y);
      return rounds.map(r => column(`${BRACKET[b]} — tour ${r}`, t.matches.filter(m => m.bracket === b && m.round === r)
        .sort((x, y) => x.position - y.position))).join('');
    };
    const finals = t.matches.filter(m => m.bracket === 'FINAL' || (m.bracket === 'RESET' && m.player1 !== '-'));
    const standings = t.standings.map(s => `<tr><td>${s.rank}</td><td>${esc(s.username)}</td><td>${s.wins}-${s.losses}</td></tr>`).join('');
    return `<h2>Winner bracket</h2><div class="bracket">${part('WINNERS')}${finals.map(m => column(BRACKET[m.bracket], [m])).join('')}</div>
      <h2>Loser bracket</h2><div class="bracket">${part('LOSERS')}</div>
      <h2>Classement</h2><table><tr><th>#</th><th>Joueur</th><th>V-D</th></tr>${standings}</table>`;
  }

  function show(t) {
    const players = t.players.map(p => `<span class="${p.dropped ? 'out' : p.checked_in ? 'in' : ''}">${esc(p.username)}</span>`).join('');
    app.innerHTML = `<p><a href="/t">← Tous les tournois</a></p>
      <h1>${esc(t.name)}</h1>
      <p><span class="chip ${t.status === 'RUNNING' ? 'running' : ''}">${STATUS[t.status] ?? t.status}</span>
      <span class="meta">${KIND[t.kind] ?? t.kind} · Bo${t.best_of} · ${esc(t.format_name)} · début ${date(t.starts_at)}</span></p>
      ${t.kind === 'SWISS' ? swiss(t) : bracket(t)}
      <h2>Inscrits (${t.players.length})</h2><div class="players">${players || '<span class="meta">personne pour l’instant</span>'}</div>`;
    app.querySelectorAll('[data-round]').forEach(b => b.onclick = () => { shownRound = +b.dataset.round; show(t); });
  }

  function showList(list) {
    app.innerHTML = `<h1>Tournois Phantasmon</h1><p class="meta">Mis à jour en direct.</p><div class="list">` +
      (list.length ? list.map(t => `<a class="card" href="/t/${encodeURIComponent(t.name)}"><strong>${esc(t.name)}</strong><br>
        <span class="meta">${KIND[t.kind] ?? t.kind} · ${STATUS[t.status] ?? t.status} · ${t.players.length} inscrits</span></a>`).join('')
        : '<p class="empty-state">Aucun tournoi.</p>') + '</div>';
  }

  async function refresh() {
    try {
      const response = await fetch(name ? `/public/tournaments/${encodeURIComponent(name)}` : '/public/tournaments');
      if (!response.ok) { app.innerHTML = '<p class="empty-state">Tournoi introuvable. <a href="/t">Tous les tournois</a></p>'; return; }
      const data = await response.json();
      name ? show(data) : showList(data);
    } catch (e) { /* network hiccup: the next refresh retries */ }
  }
  refresh();
  setInterval(refresh, 5000);
})();
</script>
</body>
</html>
