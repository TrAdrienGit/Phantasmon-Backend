spring.application.name=phantasmon-backend

spring.datasource.url=jdbc:postgresql://${BDD_HOST:localhost}:${BDD_PORT:5432}/${BDD_NAME:db_phantasmon}
spring.datasource.username=${BDD_USER}
spring.datasource.password=${BDD_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# All REST JSON payloads use snake_case field names (see Documentation/reference/openapi.yaml).
spring.jackson.property-naming-strategy=SNAKE_CASE

phantasmon.jwt.secret=${JWT_SECRET}
phantasmon.jwt.access-ttl=PT20M
phantasmon.jwt.refresh-ttl=P7D
# One-time login challenge used as the Mojang serverId (SEC-1).
phantasmon.auth.challenge-ttl=PT60S

phantasmon.logging.enabled=${LOGGING_ENABLED:true}
phantasmon.logging.directory=log
phantasmon.logging.max-total-bytes=5368709120

# One version for the whole project (TODO-4, 2026-10-03): keep current in step with the client's
# gradle.properties `version` and this repo's build.gradle `version`. Raise min-supported only to refuse older clients.
phantasmon.version.current=0.1.0
phantasmon.version.min-supported=0.1.0

# Presence TTL (CAD Partie 3 §F): a missed heartbeat past this age is treated
# as a brutal disconnect. Swept every phantasmon.presence.sweep-interval-ms.
phantasmon.presence.ttl=PT30S
phantasmon.presence.sweep-interval-ms=10000

# Live trade screen: an unanswered trade invitation expires after this delay.
phantasmon.trade.invite-ttl=PT60S

# Live Ghost battles: an unanswered battle invitation expires after this delay.
phantasmon.battle.invite-ttl=PT60S
# Battle lobby (team preview): once either player turns the timer on, whoever is not ready when it runs out
# leads with their first Pokemon.
phantasmon.battle.lobby-timer=PT150S
# Battle formats (TODO-24): Pokémon Showdown's rules are checked for updates at every start and cached here; the
# snapshot in resources/showdown/ is used when neither the site nor the cache can be read.
phantasmon.showdown.update-on-start=${PHANTASMON_SHOWDOWN_UPDATE:true}
phantasmon.showdown.cache-dir=${PHANTASMON_SHOWDOWN_CACHE_DIR:showdown-data}

# Phantasmon Network (network-cahier-des-charges.md §5.3): players in one hub at once; more are refused (ERROR_HUB_FULL).
# Hub sizes are per hub (D-35, table hubs), set by the admin who creates the hub.
phantasmon.hub.capacity=50
# Builds of the hubs (D-34, D-35): one folder hub_<name>/ per hub, holding at most one .schem / .litematic.
phantasmon.hub.schematics-dir=${PHANTASMON_HUB_SCHEMATICS_DIR:hub_schematics}
