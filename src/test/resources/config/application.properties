# Test-only overrides, layered over src/main/resources/application.properties (a classpath:/config/ file is read
# in addition to the main one, it doesn't replace it). Tests never download Showdown's data: they use the snapshot
# shipped in resources/showdown/.
phantasmon.showdown.update-on-start=false
# Global Hub build (D-34): the 21x21x21 arena generated by scripts/generate_hub_schematics.py.
phantasmon.hub.schematics-dir=src/test/resources/hub_schematics
