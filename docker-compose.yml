# PostgreSQL for the Phantasmon backend, as a container instead of a native install.
#
# Reads the same .env as the backend (BDD_USER / BDD_PASSWORD / BDD_NAME), so one set of
# credentials serves both. Nothing here is a secret: values come from .env, which is gitignored.
#
#   docker compose up -d        start (creates an empty database on first run)
#   docker compose down         stop, keeping the data (named volume)
#   docker compose down -v      stop AND delete the data
#
# Host port: BDD_DOCKER_PORT (default 5433) so it never collides with a native PostgreSQL on 5432.
# To make the backend use this container, set BDD_PORT to that same value in .env. The port is only
# published on 127.0.0.1 — the database is never reachable from the network, only the backend on this
# machine talks to it (PHANTASMON_BACKEND_RUNNING.md §8).
#
# Migrations (Flyway) run when the backend starts, exactly as against a native install.
services:
  postgres:
    image: postgres:18
    container_name: phantasmon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${BDD_USER:?BDD_USER missing from .env}
      POSTGRES_PASSWORD: ${BDD_PASSWORD:?BDD_PASSWORD missing from .env}
      POSTGRES_DB: ${BDD_NAME:-db_phantasmon}
    ports:
      - "127.0.0.1:${BDD_DOCKER_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18 images keep a versioned data directory under /var/lib/postgresql.
      - phantasmon-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  phantasmon-pgdata:
